
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>輝度チェンジャー | 思考と文章に輝きを</title>

  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: #141820;
      --border-color: #2d3545;
      --glow-intensity: 20px;
      --glow-color: rgba(255, 215, 0, 0.3);
      --gold-main: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(45deg, #fff, #ffd700, #ffa500);
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 var(--glow-intensity)
        rgba(255, 215, 0, 0.5);
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .api-panel {
      width: 100%;
      max-width: 1000px;
      background: #111622;
      border: 1px dashed #388bfd;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .api-panel input {
      flex: 1;
      min-width: 0;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .api-panel {
        flex-wrap: wrap;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 25px var(--glow-color);
      transition: all 0.3s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #f0f6fc;
      padding: 12px;
      font-size: 1rem;
      resize: none;
      outline: none;
    }

    .result-display {
      width: 100%;
      height: 220px;
      background: #0d1117;
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shine-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      padding-bottom: 4px;
    }

    .shine-score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #ffa500;
    }

    .bar-bg {
      flex: 1;
      height: 8px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffa500, #ffd700);
      width: 0%;
      transition: width 0.8s ease;
    }

    .shine-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e6edf3;
      white-space: pre-wrap;
    }

    .controls {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #ffd700;
      cursor: pointer;
    }

    .btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: linear-gradient(135deg, #d4af37, #ffd700);
      color: #000;
      border: none;
      font-size: 1.1rem;
      padding: 14px 24px;
      width: 100%;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      cursor: pointer;
      font-weight: bold;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .badge {
      background: #ffd700;
      color: #000;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #238636;
      color: #fff;
      white-space: nowrap;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 50%;
      border-top-color: #ffd700;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <header>
    <h1>輝度チェンジャー✨</h1>
    <div class="subtitle">
      日常の思考や失敗を、AIが哲学と圧倒的熱量で「輝く価値」へと昇華
    </div>
  </header>

  <div class="api-panel">
    <label for="apiKey">🤖 Gemini API Key:</label>
    <input
      type="password"
      id="apiKey"
      placeholder="Gemini APIキーを入力"
      autocomplete="off"
    >
    <span class="status-badge" id="modeBadge">Local Mode</span>
  </div>

  <div class="container">

    <div class="card">
      <div class="card-header">
        <span>原稿（プレーンテキスト）</span>
      </div>

      <textarea
        id="inputText"
        placeholder="「遅刻しました」「ラーメン食べた」「エラーが治らない」など何でも手打ちOK！"
      ></textarea>

      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="setPreset('遅刻しました')">
          遅刻
        </button>
        <button class="btn" onclick="setPreset('バグを出してしまった')">
          バグ
        </button>
        <button class="btn" onclick="setPreset('二度寝した')">
          二度寝
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>輝きアナライズ結果</span>
        <span class="badge" id="brightnessBadge">輝度: 200%</span>
      </div>

      <div class="result-display" id="resultDisplay">
        <div class="shine-title" id="resTitle">
          ✨ 輝きを解析準備中
        </div>

        <div class="shine-score-bar">
          <span>輝きエネルギー:</span>
          <div class="bar-bg">
            <div class="bar-fill" id="scoreBar"></div>
          </div>
          <span id="scoreVal">0pt</span>
        </div>

        <div class="shine-body" id="resBody">
          下の「文章の輝度を補正・解析する」ボタンを押すと、
          AIがこの文章の裏に潜む大いなる輝きを抽出します。
        </div>
      </div>

      <button class="btn" onclick="copyResult()">
        結果テキストをコピー
      </button>
    </div>

  </div>

  <div class="controls">
    <div class="slider-group">
      <label>輝度レベル:</label>
      <input
        type="range"
        id="brightnessSlider"
        min="10"
        max="200"
        value="200"
        oninput="updateSliderLabel(this.value)"
      >
      <span id="sliderValue" style="font-weight:bold;">200%</span>
    </div>

    <button
      class="btn btn-primary"
      id="submitBtn"
      onclick="transformText()"
    >
      ✨ 文章の輝度を補正・解析する
    </button>
  </div>

  <script>
    // Gemini API設定
    // Gemini API設定
const GEMINI_MODEL = "gemini-3.8-flash";

const GEMINI_URL =
  `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;

    // プリセット
    function setPreset(txt) {
      document.getElementById("inputText").value = txt;
    }

    // 輝度スライダー
    function updateSliderLabel(val) {
      document.getElementById("sliderValue").innerText = val + "%";

      document.getElementById("brightnessBadge").innerText =
        "輝度: " + val + "%";

      document.documentElement.style.setProperty(
        "--glow-intensity",
        (val / 10) + "px"
      );

      document.documentElement.style.setProperty(
        "--glow-color",
        `rgba(255, 215, 0, ${val / 300})`
      );
    }

    // APIモード表示
    function setApiStatus(message, color) {
      const badge = document.getElementById("modeBadge");
      badge.innerText = message;
      badge.style.background = color;
    }

    document.getElementById("apiKey").addEventListener("input", (e) => {
      if (e.target.value.trim()) {
        setApiStatus("API Key Entered", "#1f6feb");
      } else {
        setApiStatus("Local Mode", "#238636");
      }
    });

    // メイン処理
    async function transformText() {
      const input = document.getElementById("inputText").value.trim();
      const apiKey = document.getElementById("apiKey").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      const brightness = parseInt(
        document.getElementById("brightnessSlider").value,
        10
      );

      if (!input) {
        alert("テキストを入力してください");
        return;
      }

      submitBtn.disabled = true;

      document.getElementById("resTitle").innerText =
        "✨ AI解析中...";

      document.getElementById("resBody").innerText =
        "輝きのエネルギーと真の価値を深層抽出中...";

      try {
        if (apiKey) {
          // Gemini APIを使用
          setApiStatus("Connecting...", "#d29922");

          const result = await callGeminiAPI(
            input,
            brightness,
            apiKey
          );

          renderResult(
            result.title,
            result.score,
            result.body
          );

          setApiStatus("Gemini API Active", "#238636");

        } else {
          // APIキー未入力時だけローカルモード
          const result = localTransform(input, brightness);

          renderResult(
            result.title,
            result.score,
            result.body
          );

          setApiStatus("Local Mode", "#238636");
        }

      } catch (error) {
        console.error("Gemini API Error:", error);

        setApiStatus("API Error", "#da3633");

        document.getElementById("resTitle").innerText =
          "❌ API接続エラー";

        document.getElementById("resBody").innerText =
          error.message;

      } finally {
        submitBtn.disabled = false;
      }
    }

    // Gemini API呼び出し
    async function callGeminiAPI(text, brightness, apiKey) {

      const prompt = `
あなたは「人間のあらゆる行いや言葉から【輝き】を抽出する熱血哲学者AI」です。

入力された文章がどれほど地味、ネガティブ、失敗談であっても、
圧倒的な熱量と哲学でユーモラスかつ感動的に
「輝かしい価値」へ反転させてください。

【変換対象の文章】
${text}

【輝度レベル】
${brightness}%

輝度が低い場合は自然で控えめなポジティブ表現にしてください。
輝度が高いほど、大げさでキラキラした情熱的な文体にしてください。
200%では最大級の熱量と絵文字を使ってください。

【出力ルール】
・文章の内容に応じた称号を作成する
・輝きエネルギーを0〜200の数値で評価する
・反転・補正後の文章を2〜3文で作成する
・入力文章の内容をきちんと反映させる
・JSON形式のみで回答する

【出力JSON形式】
{
  "title": "✨ 称号",
  "score": 180,
  "body": "輝きに満ちた文章"
}
`;

      const requestBody = {
        contents: [
          {
            role: "user",
            parts: [
              { text: prompt }
            ]
          }
        ],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.9,
          maxOutputTokens: 1024
        }
      };

      const response = await fetch(GEMINI_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify(requestBody)
      });

      // エラー詳細を取得
      if (!response.ok) {
        const errorText = await response.text();

        let errorMessage = errorText;

        try {
          const errorData = JSON.parse(errorText);
          errorMessage =
            errorData.error?.message || errorText;
        } catch (_) {
          // JSON形式以外のエラーはそのまま表示
        }

        throw new Error(
          `HTTP ${response.status}: ${errorMessage}`
        );
      }

      const data = await response.json();

      // Geminiの回答を取得
      const rawText = data.candidates?.[0]?.content?.parts
        ?.filter(part => typeof part.text === "string")
        .map(part => part.text)
        .join("")
        .trim();

      if (!rawText) {
        throw new Error(
          "AIから有効な回答が返されませんでした。\n" +
          JSON.stringify(data, null, 2)
        );
      }

      // JSON変換
      let result;

      try {
        result = JSON.parse(
          rawText
            .replace(/^```(?:json)?\s*/i, "")
            .replace(/\s*```$/, "")
        );
      } catch (error) {
        throw new Error(
          "AIの回答をJSONとして解析できませんでした。\n" +
          rawText
        );
      }

      // 回答形式チェック
      if (
        typeof result.title !== "string" ||
        typeof result.body !== "string" ||
        !Number.isFinite(Number(result.score))
      ) {
        throw new Error(
          "AIの回答形式が正しくありません。\n" +
          rawText
        );
      }

      return {
        title: result.title,
        score: Math.max(
          0,
          Math.min(200, Number(result.score))
        ),
        body: result.body
      };
    }

    // ローカルモード
    function localTransform(input, brightness) {
      const score = Math.min(200, brightness + 15);

      return {
        title: "✨ 【時間概念の超越者】",
        score: score,
        body:
          `「${input}」という行動は一見ポジティブに見えないかもしれません。` +
          "しかし、既存の枠組みにとらわれず自らのタイミングを貫いたという点において、" +
          "揺るぎない輝きを放っています！"
      };
    }

    // 結果表示
    function renderResult(title, score, body) {
      document.getElementById("resTitle").innerText = title;

      document.getElementById("resBody").innerText = body;

      document.getElementById("scoreVal").innerText =
        score + " pt";

      document.getElementById("scoreBar").style.width =
        Math.min(100, (score / 200) * 100) + "%";
    }

    // 結果コピー
    async function copyResult() {
      const title = document.getElementById("resTitle").innerText;
      const body = document.getElementById("resBody").innerText;

      try {
        await navigator.clipboard.writeText(
          `${title}\n${body}`
        );
        alert("コピーしました！");
      } catch (error) {
        alert("コピーに失敗しました");
      }
    }
  </script>

</body>
</html>
